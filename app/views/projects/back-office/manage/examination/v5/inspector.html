{% extends "layouts/back-office.html" %}

{% block pageTitle %}Inspector details – {{ serviceName }}{% endblock %}
{% block beforeContent %}
  {{ govukBackLink({ text: "Back", href: returnUrl }) }}
{% endblock %}
{% block content %}
  <div class="govuk-grid-row"><div class="govuk-grid-column-two-thirds">
    <h1 class="govuk-heading-l">Who is the examining inspector?</h1>
    <form method="post">
      <input type="hidden" name="editIndex" value="{{ editIndex }}">
      <input type="hidden" name="returnUrl" value="{{ returnUrl }}">
      <div class="govuk-form-group">
        <label class="govuk-label govuk-visually-hidden" for="inspector-name">Inspector name</label>
        <input class="govuk-input govuk-!-width-two-thirds" id="inspector-name" name="name" type="text" value="{{ inspector.name or '' }}">
      </div>
      <button class="govuk-button" type="submit">Save and continue</button>
    </form>
  </div></div>
{% endblock %}
